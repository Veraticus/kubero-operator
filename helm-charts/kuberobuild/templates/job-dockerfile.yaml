{{- if eq .Values.buildstrategy "dockerfile" }}
{{- $name := printf "%s-%s-%s" .Values.app .Values.pipeline .Values.id -}}
apiVersion: batch/v1
kind: Job
metadata:
  generation: 1
  labels:
    batch.kubernetes.io/job-name: {{ $name }}
    buildstrategy: dockerfile
    kuberoapp: {{ .Values.app }}
    kuberopipeline: {{ .Values.pipeline }}
    job-name: {{ $name }}
  name: {{ $name }}
spec:
  backoffLimit: 1
  completionMode: NonIndexed
  completions: 1
  manualSelector: false
  parallelism: 1
  podReplacementPolicy: TerminatingOrFailed
  suspend: false
  template:
    metadata:
      creationTimestamp: null
      labels:
        batch.kubernetes.io/job-name: {{ $name }}
        buildstrategy: {{ .Values.buildstrategy }}
        kuberoapp: {{ .Values.app }}
        kuberopipeline: {{ .Values.pipeline }}
        job-name: {{ $name }}
    spec:
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - env:
          - name: REPOSITORY
            value: "{{ .Values.repository.image | default "" }}"
          - name: TAG
            value: "{{ .Values.repository.tag | default "latest"}}"
          - name: APP
            value: {{ .Values.app }}
          - name: PIPELINE
            value: {{ .Values.pipeline }}
          command:
          - sh
          - -c
          - |
            # If REPOSITORY is not provided, construct it from pipeline's registry
            if [ -z "$REPOSITORY" ]; then
              echo "Repository not provided, fetching from pipeline configuration..."
              REGISTRY=$(kubectl get kuberopipeline $PIPELINE -n kubero -o jsonpath='{.spec.registry.host}')
              if [ -n "$REGISTRY" ]; then
                REPOSITORY="${REGISTRY}/${PIPELINE}-${APP}"
                echo "Using registry from pipeline: $REPOSITORY"
              else
                echo "Error: No registry found in pipeline configuration"
                exit 1
              fi
            fi
            kubectl patch kuberoapps $APP --type=merge -p '{"spec":{"image":{"repository":"'$REPOSITORY'","tag":"'$TAG'"}}}'
          image: bitnami/kubectl:latest
          imagePullPolicy: Always
          name: deploy
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      initContainers:
        - name: fetch
          env:
          - name: GIT_REPOSITORY
            value: {{ .Values.git.url }}
          - name: GIT_REF
            value: {{ .Values.git.ref }}
          - name: KUBERO_BUILDPACK_DEFAULT_RUN_CMD
            value: "exit 0"
          - name: KUBERO_BUILDPACK_DEFAULT_BUILD_CMD
            value: "exit 0"
          image: "ghcr.io/kubero-dev/fetch:latest"
          imagePullPolicy: Always
          resources: {}
          securityContext:
            readOnlyRootFilesystem: false
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /home/kubero/.ssh-mounted
            name: deployment-keys
            readOnly: true
          - mountPath: /app
            name: app-storage
          workingDir: /app
        - name: push
          command:
          - sh
          - -c
          - |-
            # Construct repository URL from pipeline if not provided
            if [ -n "$REPOSITORY_OVERRIDE" ]; then
              BUILD_IMAGE="${REPOSITORY_OVERRIDE}:${TAG}"
            else
              REGISTRY=$(kubectl get kuberopipeline $PIPELINE -n kubero -o jsonpath='{.spec.registry.host}')
              if [ -n "$REGISTRY" ]; then
                BUILD_IMAGE="${REGISTRY}/${PIPELINE}-${APP}:${TAG}"
              else
                echo "Error: No registry found in pipeline configuration"
                exit 1
              fi
            fi
            echo "Building and pushing image: $BUILD_IMAGE"
            buildah build -f $BUILDAH_DOCKERFILE_PATH --isolation chroot -t $BUILD_IMAGE .
            buildah push --tls-verify=false $BUILD_IMAGE
          env:
          - name: REGISTRY_AUTH_FILE
            value: /etc/buildah/auth/.dockerconfigjson
          - name: REPOSITORY_OVERRIDE
            value: "{{ .Values.repository.image | default "" }}"
          - name: TAG
            value: "{{ .Values.repository.tag | default "latest"}}"
          - name: PIPELINE
            value: {{ .Values.pipeline }}
          - name: APP
            value: {{ .Values.app }}
          - name: BUILDAH_DOCKERFILE_PATH
            value: /app/{{ .Values.dockerfile.path}}
          image: "quay.io/containers/buildah:v1.35"
          imagePullPolicy: IfNotPresent
          resources: {}
          securityContext:
            privileged: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          volumeMounts:
          - mountPath: /app
            name: app-storage
            readOnly: true
          - mountPath: /etc/buildah/auth
            name: pull-secret
            readOnly: true
          - mountPath: /etc/containers/registries.conf
            name: buildah-registries-conf
            subPath: registries.conf
            readOnly: true
          workingDir: /app
      restartPolicy: Never
      schedulerName: default-scheduler
      serviceAccount: {{ .Values.app }}
      serviceAccountName: {{ .Values.app }}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: deployment-keys
        secret:
          defaultMode: 0666
          secretName: deployment-keys
      - emptyDir: {}
        name: app-storage
      - name: pull-secret
        secret:
          defaultMode: 384
          secretName: kubero-pull-secret
      - name: buildah-registries-conf
        configMap:
          name: buildah-registries-conf
          defaultMode: 0644
  ttlSecondsAfterFinished: 31536000
{{- end }}