{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kuberoapp.serviceAccountName" . }}
  labels:
    {{- include "kuberoapp.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "kuberoapp.serviceAccountName" . }}role
rules:
  - apiGroups: ["application.kubero.dev"]
    resources: ["kuberoapps"]
    verbs: ["update", "patch", "get", "list", "watch"]
  - apiGroups: ["application.kubero.dev"]
    resources: ["kuberobuilds"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: ["application.kubero.dev"]
    resources: ["kuberopipelines"]
    verbs: ["get", "list"]

---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "kuberoapp.serviceAccountName" . }}rolebinding
subjects:
  - kind: ServiceAccount
    name: {{ include "kuberoapp.serviceAccountName" . }}
roleRef:
  kind: Role
  name: {{ include "kuberoapp.serviceAccountName" . }}role
  apiGroup: rbac.authorization.k8s.io

---
# ClusterRole to read pipelines from kubero namespace
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Values.pipeline }}-{{ .Values.name }}-pipeline-reader
rules:
  - apiGroups: ["application.kubero.dev"]
    resources: ["kuberopipelines"]
    verbs: ["get", "list"]

---
# ClusterRoleBinding to allow reading pipeline from kubero namespace
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Values.pipeline }}-{{ .Values.phase }}-{{ .Values.name }}-pipeline-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "kuberoapp.serviceAccountName" . }}
    namespace: {{ .Values.pipeline }}-{{ .Values.phase }}
roleRef:
  kind: ClusterRole
  name: {{ .Values.pipeline }}-{{ .Values.name }}-pipeline-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}
