{{- if and (eq .Values.deploymentstrategy "git") (or (eq .Values.buildstrategy "dockerfile") (eq .Values.buildstrategy "nixpacks") (eq .Values.buildstrategy "buildpacks")) (not .Values.skipInitialBuild) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kuberoapp.fullname" . }}-initial-build
  namespace: {{ .Values.pipeline }}-{{ .Values.phase }}
  labels:
    {{- include "kuberoapp.labels" . | nindent 4 }}
    job-type: initial-build
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      labels:
        {{- include "kuberoapp.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ .Values.name }}-kuberoapp
      containers:
      - name: trigger-build
        image: bitnami/kubectl:latest
        command:
        - /bin/sh
        - -c
        - |
          echo "Checking if initial build is needed for {{ .Values.name }}"
          
          # Check if any KuberoBuild already exists for this app
          EXISTING_BUILDS=$(kubectl get kuberobuilds -n {{ .Values.pipeline }}-{{ .Values.phase }} -l app={{ .Values.name }} --no-headers 2>/dev/null | wc -l)
          
          if [ "$EXISTING_BUILDS" -gt "0" ]; then
            echo "Build already exists for {{ .Values.name }}, skipping initial build"
            exit 0
          fi
          
          # Check if the app already has an image configured (not the idler)
          CURRENT_IMAGE=$(kubectl get kuberoapp {{ .Values.name }} -n {{ .Values.pipeline }}-{{ .Values.phase }} -o jsonpath='{.spec.image.repository}' 2>/dev/null || echo "")
          if [ -n "$CURRENT_IMAGE" ] && [ "$CURRENT_IMAGE" != "ghcr.io/kubero-dev/idler" ]; then
            echo "App already has a custom image configured: $CURRENT_IMAGE, skipping initial build"
            exit 0
          fi
          
          echo "Triggering initial build for {{ .Values.name }}"
          # Wait for the app to be fully created
          sleep 5
          
          # Create a KuberoBuild resource to trigger the build
          cat <<EOF | kubectl apply -f -
          apiVersion: application.kubero.dev/v1alpha1
          kind: KuberoBuild
          metadata:
            name: {{ .Values.name }}-initial-$(date +%s)
            namespace: {{ .Values.pipeline }}-{{ .Values.phase }}
          spec:
            app: {{ .Values.name }}
            pipeline: {{ .Values.pipeline }}
            phase: {{ .Values.phase }}
            buildstrategy: {{ .Values.buildstrategy }}
            {{- if .Values.gitrepo }}
            gitrepo:
              url: {{ .Values.gitrepo.clone_url | default .Values.gitrepo.ssh_url }}
              ref: {{ .Values.branch }}
            {{- end }}
            registry:
              tag: {{ .Values.branch }}-$(date +%s)
              # Repository will be constructed from pipeline's registry configuration
          EOF
          
          echo "Initial build triggered successfully"
{{- end }}